<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Energy Controller</title>
    <script src="https://unpkg.com/vue@3.5.16/dist/vue.global.prod.js"></script>
    <style>
        #app {
            display: flex;
            flex-direction: column;
            height: 98vh; /* Use almost full viewport height */
        }
        :root {
            --bg-color: #fafafa;
            --card-bg: #EBEBEB;
            --text-color: #0e1117;
            --accent: #ff4b4b;
            --border-radius: 8px;
            --border-color: #444;
            --info-label: #525252;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 10px; }
        h2, h3, h4, h5 { margin: 1px 0; line-height: 1.5; }
        .header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
        .header-actions { display: flex; gap: 8px; align-items: center; }

        /* Tabs */
        .tabs { border-bottom: 2px solid var(--border-color); margin-bottom: 20px; }
        .tab { background: none; border: none; color: #888; font-size: 1rem; padding: 10px 20px; cursor: pointer; }
        .tab.active { color: var(--text-color); border-bottom: 3px solid var(--accent); font-weight: bold; }
        .tab-content-flex {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        /* Grid System */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Cards */
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--border-radius); padding: 10px; margin-bottom: 10px; }
        .card h3 { font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .plan-card {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 5px !important;
        }

        /* Metrics */
        .metric { display: flex; flex-direction: column; }
        .metric-label { font-size: 0.9rem; color: var(--info-label); }
        .metric-value { font-size: 1.2rem; font-weight: bold; margin: 2px 0; }

        /* Forms & Controls */
        .control-group { margin-bottom: 8px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: var(--text-color); }
        select, input[type="number"], input[type="password"] { box-sizing: border-box; padding: 4px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); }
        input[type="password"] { width: 100%; padding: 8px; }
        select { width: 100%; }
        .input-compact { width: 80px; display: inline-block; }
        select:focus, input:focus { outline: 2px solid var(--accent); }
        .login-card { max-width: 420px; margin: 80px auto; padding: 20px; }
        .error-text { color: #d32f2f; font-size: 0.85rem; margin: 8px 0; }

        /* Buttons */
        button.btn { background: #333; color: white; border: 1px solid #555; padding: 10px 15px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        button.btn:hover { background: #444; }
        button.btn:disabled { opacity: 0.6; cursor: not-allowed; }
        button.btn-primary { background: var(--accent); border: none; }
        button.btn-primary:hover { background: #ff3333; }

        /* Toasts */
        .toast { position: fixed; bottom: 20px; right: 20px; background: #4CAF50; color: white; padding: 15px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: opacity 0.5s; opacity: 1; }
        .toast-hide { opacity: 0; pointer-events: none; }

        .sub-value {
            font-size: 0.85rem;
            color: var(--info-label);
            margin-top: 5px;
            margin-bottom: 5px;
        }
        .status-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: white;
            text-transform: uppercase;
        }
        .incident-row {
            padding: 8px;
            border-bottom: 1px solid #d0d0d0;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
        }
        .incident-meta {
            color: var(--info-label);
            font-size: 0.75rem;
            margin-top: 4px;
        }
        .notification-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .notification-options label {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            margin: 0;
        }
        .compact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .unit {
            color: var(--info-label);
            font-size: 0.6rem;
            font-weight: normal;
            margin-left: 4px;
        }
        .log-container {
            max-height: 65vh;
            overflow-y: auto;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.8rem;
        }
        .error { color: #ff5252; }
        .warning { color: #fb8c00; }
        .info { color: #e0e0e0; }
        .debug { color: #9e9e9e; font-style: italic; }
        .log-line {
            padding: 2px 0;
            border-bottom: 1px solid grey;
            white-space: pre-wrap;
            line-height: 1.2;
        }
        .timestamp {
            color: white;
            font-size: 0.8rem;
            margin-right: 8px;
        }
        .table-scroll-container {
            flex-grow: 1;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }
        .plan-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: var(--card-bg);
        }
        .plan-table th {
            padding: 4px 8px !important;
            font-size: 0.8rem;
            text-align: left
        }
        .plan-table td {
            padding: 2px 8px !important; /* Minimal vertical padding */
            line-height: 1.1;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .soc-high-vis {
            color: #000 !important; /* Force black for contrast on grey */
            border-radius: 3px;
            padding: 0 4px;
        }
        .plan-table tr:hover { background: #e0e0e0; }
        .highlight-row { background: #fff5f5; font-weight: bold; }
        .state-container {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #333;
            max-height: 75vh;
            overflow-y: auto;
        }
        .json-render {
            color: #9cdcfe;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .json-render {
            tab-size: 2;
            scrollbar-width: thin;
            scrollbar-color: #444 #1e1e1e;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="header-row">
        <h3>🏠 Home Energy Control</h3>

        <div class="header-actions" v-if="auth.authEnabled && auth.authenticated">
            <button class="btn" type="button" @click="logout" style="padding: 5px 12px;">Logout</button>
        </div>
    </div>

    <div v-if="!authChecked" class="card">
        Loading dashboard...
    </div>

    <div v-else-if="auth.authEnabled && !auth.authenticated" class="card login-card">
        <h4>Dashboard Login</h4>
        <form @submit.prevent="login">
            <div class="control-group">
                <label for="login-password">Password:</label>
                <input id="login-password" type="password" v-model="loginPassword" autocomplete="current-password">
            </div>
            <div v-if="loginError" class="error-text">{{ loginError }}</div>
            <button class="btn btn-primary" type="submit" :disabled="isLoggingIn">
                {{ isLoggingIn ? 'Signing in...' : 'Sign in' }}
            </button>
        </form>
    </div>

    <template v-else>
    <div class="tabs" role="tablist" aria-label="Dashboard sections" @keydown="handleTabKeydown">
        <button id="tab-dashboard" type="button" class="tab" role="tab"
                :class="{active: currentTab === 'dashboard'}"
                :aria-selected="currentTab === 'dashboard'"
                aria-controls="panel-dashboard"
                :tabindex="currentTab === 'dashboard' ? 0 : -1"
                @click="setCurrentTab('dashboard')">📊 Dashboard</button>
        <button id="tab-plan" type="button" class="tab" role="tab"
                :class="{active: currentTab === 'plan'}"
                :aria-selected="currentTab === 'plan'"
                aria-controls="panel-plan"
                :tabindex="currentTab === 'plan' ? 0 : -1"
                @click="setCurrentTab('plan')">📅 Prediction</button>
        <button id="tab-incidents" type="button" class="tab" role="tab"
                :class="{active: currentTab === 'incidents'}"
                :aria-selected="currentTab === 'incidents'"
                aria-controls="panel-incidents"
                :tabindex="currentTab === 'incidents' ? 0 : -1"
                @click="setCurrentTab('incidents')">Incidents</button>
        <button id="tab-logs" type="button" class="tab" role="tab"
                :class="{active: currentTab === 'logs'}"
                :aria-selected="currentTab === 'logs'"
                aria-controls="panel-logs"
                :tabindex="currentTab === 'logs' ? 0 : -1"
                @click="setCurrentTab('logs')">📜 Logs</button>
        <button id="tab-state" type="button" class="tab" role="tab"
                :class="{active: currentTab === 'state'}"
                :aria-selected="currentTab === 'state'"
                aria-controls="panel-state"
                :tabindex="currentTab === 'state' ? 0 : -1"
                @click="setCurrentTab('state')">🔍 App State</button>
    </div>

    <div id="panel-dashboard" role="tabpanel" aria-labelledby="tab-dashboard" v-show="currentTab === 'dashboard'">

        <div v-if="!state" style="color: #ff4b4b;">
            🚨 Main application state not available. Loading...
        </div>

        <div v-else>
            <h5>Application Status:
                <span :style="{ color: statusColor, fontWeight: 'bold' }">
                    {{ (state.app_state || 'UNKNOWN').replace('_', ' ').toUpperCase() }}
                </span>
            </h5>

            <div class="compact-grid">
                <div class="card">
                    <h4>💡 Market price</h4>
                    <div style="grid-column: span 2; font-size: 0.8rem; color: var(--info-label); margin-bottom: 12px">
                        Interval: {{ formatTimeHm(currentPrice.start) }} - {{ formatTimeHm(currentPrice.end) }} (LT)
                    </div>
                    <div v-if="currentPrice" class="grid-2">
                        <div class="metric">
                            <span class="metric-label">Net buy</span>
                            <span v-if="currentPrice.buy !== null">
                                <span class="metric-value">{{ (currentPrice.buy * 100).toFixed(1) }}</span>
                                <span class="unit">€c/kWh</span>
                            </span>
                            <span v-else class="metric-value">N/A</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Net sell</span>
                            <span v-if="currentPrice.sell !== null">
                                <span class="metric-value">{{ (currentPrice.sell * 100).toFixed(1) }}</span>
                                <span class="unit">€c/kWh</span>
                            </span>
                            <span v-else class="metric-value">N/A</span>
                        </div>
                    </div>
                    <div v-else style="color: #ffaa00;">Current electricity price data not available.</div>
                </div>

                <div class="card">
                    <h4>🔋 Batteries</h4>
                    <div style="margin-bottom: 10px; font-size: small">Mode: <strong>{{ batteryModeDisplay }}</strong></div>

                    <div class="grid-2" v-if="state.battery_records && state.battery_records.length > 0">
                        <div class="metric" v-for="(bat, idx) in state.battery_records" :key="idx">
                            <span class="metric-label">{{ bat.battery_name || 'Battery ' + (idx+1) }}</span>
                            <span class="metric-value">{{ bat.state_of_charge_pct !== null ? bat.state_of_charge_pct + '%' : 'N/A' }}</span>
                        </div>
                    </div>
                    <div v-else style="color: #888;">No detailed battery records available yet.</div>
                </div>
            </div>

            <div class="compact-grid">
                <div class="card">
                    <h4>☀️ Inverter</h4>
                    <div class="metric">
                        <span class="metric-label">Production</span>
                        <span class="metric-value" style="color: #48AB4C;">
                            {{ state.inverter_data?.pv_power_watts ?? 0 }} W
                        </span>
                    </div>
                    <div class="sub-value">
                        Limit: {{ state.inverter_data?.active_power_limit_watts }} W
                    </div>
                    <span class="status-badge" :style="{ color: state.inverter_data?.operational_status === 'NORMAL' ? '#4CAF50' : '#FF9800' }">
                        {{ state.inverter_data?.operational_status }}
                    </span>
                </div>

                <div class="card">
                    <h4>🔌 Net</h4>
                    <div class="metric">
                        <span class="metric-label">Current</span>
                        <span class="metric-value" :style="{ color: state.p1_meter_data?.active_power_w > 0 ? '#AB48A8' : '#48AB4C' }">
                            {{ state.p1_meter_data?.active_power_w ?? 0 }} W
                        </span>
                    </div>
                    <div class="sub-value">
                        Month peak: <strong>{{ state.p1_meter_data?.monthly_power_peak_w }} W</strong>
                    </div>
                    <div style="font-size: 0.65rem; color: #666; margin-top: 5px">
                        at: {{ formatPeakTimestamp(state.p1_meter_data?.monthly_power_peak_timestamp) }}
                    </div>
                </div>
            </div>

            <div class="card">
                <h4>⚙️ Controls</h4>
                <div class="grid-2">
                    <div>
                        <div class="control-group">
                            <label for="app-operating-mode">Application mode:</label>
                            <select id="app-operating-mode" v-model="state.app_operating_mode" :disabled="isPending('app_operating_mode')"
                                    @change="updateSetting('app_operating_mode', state.app_operating_mode)">
                                <option v-for="opt in enums.OperatingMode" :value="opt.name">{{ opt.value }}</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="app-mediator-goal">Mediator goal:</label>
                            <select id="app-mediator-goal" v-model="state.app_mediator_goal" :disabled="isPending('app_mediator_goal')"
                                    @change="updateSetting('app_mediator_goal', state.app_mediator_goal)">
                                <option v-for="opt in enums.MediatorGoal" :value="opt.name">{{ opt.value }}</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="inverter-manual-state">Inverter mode:</label>
                            <select id="inverter-manual-state" v-model="state.inverter_manual_state" :disabled="isPending('inverter_manual_state')"
                                    @change="updateSetting('inverter_manual_state', state.inverter_manual_state)">
                                <option v-for="opt in enums.InverterManualState" :value="opt.name">{{ opt.value }}</option>
                            </select>
                        </div>



                    </div>

                    <div>
                        <div class="control-group">
                            <label for="battery-manual-mode">Battery mode:</label>
                            <select id="battery-manual-mode" v-model="state.battery_manual_mode" :disabled="isPending('battery_manual_mode')"
                                    @change="updateSetting('battery_manual_mode', state.battery_manual_mode)">
                                <option v-for="opt in enums.BatteryState" :value="opt.name">{{ opt.value }}</option>
                            </select>
                        </div>

                        <div class="control-group">
                            <label for="evcc-manual-state">EVCC mode:</label>
                            <select id="evcc-manual-state" v-model="state.evcc_manual_state" :disabled="isPending('evcc_manual_state')"
                                    @change="updateSetting('evcc_manual_state', state.evcc_manual_state)">
                                <option v-for="opt in enums.EVCCManualState" :key="opt.name" :value="opt.name">{{ opt.value }}</option>
                            </select>
                        </div>

                        <div class="grid-2">
                            <div class="control-group">
                            <label for="inverter-manual-limit">Inverter limit:</label>
                            <input id="inverter-manual-limit" type="number" class="input-compact" min="0" max="7000" step="100" v-model.number="state.inverter_manual_limit"
                                   :disabled="isPending('inverter_manual_limit')"
                                   @change="updateSetting('inverter_manual_limit', state.inverter_manual_limit)">
                            </div>

                            <div class="control-group">
                                <label for="evcc-manual-limit">EVCC limit:</label>
                                <input id="evcc-manual-limit" type="number" class="input-compact" min="6" max="32" step="1" v-model.number="state.evcc_manual_limit"
                                       :disabled="isPending('evcc_manual_limit')"
                                       @change="updateSetting('evcc_manual_limit', state.evcc_manual_limit)">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h4>Notifications</h4>
                <div class="notification-options">
                    <label>
                        <input type="checkbox" v-model="notificationPreferences.warning">
                        Warning
                    </label>
                    <label>
                        <input type="checkbox" v-model="notificationPreferences.error">
                        Error
                    </label>
                    <label>
                        <input type="checkbox" v-model="notificationPreferences.peak_consumption">
                        Peak consumption
                    </label>
                    <button class="btn" @click="activateNotificationDevice" :disabled="isActivatingNotificationDevice">
                        {{ notificationDevice.active ? 'Update this device' : 'Activate this device' }}
                    </button>
                </div>
                <div class="sub-value" v-if="notificationDevice.active">
                    Device active: {{ notificationDevice.label }}
                </div>
                <div class="sub-value" v-if="notificationDevice.error" style="color: #d32f2f;">
                    {{ notificationDevice.error }}
                </div>
            </div>

            <div class="grid-2">
                <button class="btn btn-primary" @click="requestRestart" :disabled="isPending('reboot_request')">
                    Stop for supervised restart
                </button>
                <button class="btn" @click="requestSummary" :disabled="isPending('summary_request')">
                    Daily summary
                </button>
            </div>
            <div class="sub-value" v-if="summaryJobStatusText">
                Summary: {{ summaryJobStatusText }}
            </div>

            <p v-if="state.restart_status && state.restart_status !== 'idle'"
               style="color: #666; font-size: 0.8rem; margin-top: 10px;">
                Restart: {{ state.restart_status }}<span v-if="state.restart_message"> - {{ state.restart_message }}</span>
            </p>

            <p style="color: #666; font-size: 0.8rem; margin-top: 10px;">Last sync: {{ lastSync }}</p>
        </div>
    </div>

    <div id="panel-plan" role="tabpanel" aria-labelledby="tab-plan" v-show="currentTab === 'plan'" class="tab-content-flex">
        <div class="card plan-card" v-if="state?.prediction_plan">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <h5 style="margin: 0;">📅 Prediction Plan</h5>
                <span class="status-badge" style="background: #333; color: white;">{{ state.prediction_plan.length }} intervals</span>
            </div>

            <div class="table-scroll-container">
                <table class="plan-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Net</th>
                            <th>Sell</th>
                            <th>🚫D</th>
                            <th>🚫C</th>
                            <th>⚡C</th>
                            <th>SOC%</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(row, idx) in state.prediction_plan" :key="idx"
                            :class="{ 'highlight-row': isCurrentInterval(row.index) }">

                            <td>{{ row.index ? formatTime(row.index).substring(0, 5) : '??:??' }}</td>

                            <td :style="{ color: row.net_kwh > 0 ? '#1b5e20' : '#b71c1c', fontWeight: 'bold' }">
                                {{ row.net_kwh !== null ? (row.net_kwh * 4000).toFixed(0) : '--' }}
                            </td>

                            <td>{{ row.sell_price !== null ? (row.sell_price * 100).toFixed(1) + 'c' : '--' }}</td>

                            <td>{{ row.block_d ? '🚫' : '' }}</td>
                            <td>{{ row.block_c ? '🚫' : '' }}</td>
                            <td>{{ row.force_c ? '⚡' : '' }}</td>

                            <td>
                                <span class="soc-high-vis" :style="{ color: row.new_pct < 15 ? '#d32f2f !important' : '#000' }">
                                    {{ row.new_pct !== null ? row.new_pct.toFixed(0) + '%' : '--' }}
                                </span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div v-else class="card">No prediction plan available.</div>
    </div>

    <div id="panel-incidents" role="tabpanel" aria-labelledby="tab-incidents" v-show="currentTab === 'incidents'">
        <h5>Incidents</h5>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px;">
                <h4>Active</h4>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button class="btn" @click="acknowledgeAllIncidents"
                            :disabled="incidents.active.length === 0"
                            style="padding: 5px 15px;">
                        Acknowledge all
                    </button>
                    <button class="btn" @click="fetchIncidents" :disabled="isFetchingIncidents"
                            style="padding: 5px 15px; background-color: grey">
                        {{ isFetchingIncidents ? '...' : 'Refresh' }}
                    </button>
                </div>
            </div>
            <div v-if="incidents.active.length === 0" class="sub-value">No active incidents.</div>
            <div v-for="incident in incidents.active" :key="incident.id" class="incident-row">
                <div>
                    <span class="status-badge" :class="incident.severity">{{ incident.severity }}</span>
                    <strong>{{ incident.source }}</strong>
                    <div>{{ incident.message }}</div>
                    <div class="incident-meta">
                        Count {{ incident.occurrence_count }} - last {{ formatTime(incident.last_seen_utc) }}
                    </div>
                </div>
                <button class="btn" @click="acknowledgeIncident(incident.id)">Acknowledge</button>
            </div>
        </div>

        <div class="card">
            <h4>Recently resolved</h4>
            <div v-if="incidents.resolved.length === 0" class="sub-value">No resolved incidents.</div>
            <div v-for="incident in incidents.resolved" :key="incident.id" class="incident-row">
                <div>
                    <span class="status-badge" :class="incident.severity">{{ incident.severity }}</span>
                    <strong>{{ incident.source }}</strong>
                    <span>{{ incident.message }}</span>
                    <div class="incident-meta">Resolved {{ formatTime(incident.resolved_at_utc) }}</div>
                </div>
            </div>
        </div>
    </div>

    <div id="panel-logs" role="tabpanel" aria-labelledby="tab-logs" v-show="currentTab === 'logs'">
        <h5>Application Logs</h5>
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h4>📜 System Logs</h4>
                <span class="status-badge">{{ filteredLogs.length }} entries shown</span>
            </div>

            <div class="control-group" style="margin-bottom: 15px; display: flex; gap: 10px; align-items: center;">
                <label style="margin: 0;">Filter:</label>
                <select v-model="logFilter" style="width: auto; min-width: 150px;">
                    <option value="ALL">Show All</option>
                    <option value="IMPORTANT">⚠️ Errors & Warnings</option>
                    <option value="ERROR">🔴 Errors Only</option>
                    <option value="WARNING">🟠 Warnings Only</option>
                    <option value="INFO">⚪ Info Only</option>
                    <option value="DEBUG">🟣 Debug Only</option>
                </select>
                <select v-model="logLimit" @change="fetchLogs" style="width: auto;">
                    <option :value="100">Last 100</option>
                    <option :value="1000">Last 1000</option>
                    <option :value="5000">Last 5000</option>
                    <option :value="10000">Last 10000</option>
                </select>
                <button class="btn" @click="fetchLogs" :disabled="isFetchingLogs"
                        style="padding: 5px 15px; margin-bottom: 10px; background-color: grey">
                    {{ isFetchingLogs ? '...' : '🔄 Refresh' }}
                </button>
            </div>

            <div class="log-container">
                <div v-if="filteredLogs.length === 0" style="padding: 20px; text-align: center; color: #888;">
                    No logs match the selected filter.
                </div>

                <div v-for="log in filteredLogs" :key="log.id" :class="['log-line', log.level.toLowerCase()]">
                    <span class="timestamp">[{{ formatTime(log.timestamp) }}]</span>
                    <span class="status-badge" style="margin-right: 8px; font-size: 0.6rem;">{{ log.level }}</span>
                    <span class="message">{{ log.message }}</span>
                    <div v-if="log.module" style="font-size: 0.65rem; color: white; margin-left: 5px; display: inline;">
                        ({{ log.module }})
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="panel-state" role="tabpanel" aria-labelledby="tab-state" v-show="currentTab === 'state'">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h5>Raw Application State</h5>
                <button class="btn" @click="fetchState" style="padding: 5px 15px;">🔄 Refresh State</button>
            </div>

            <div class="state-container">
                <pre class="json-render">{{ formattedState }}</pre>
            </div>
        </div>
    </div>

    </template>

    <div class="toast" :class="{'toast-hide': !toast.show}">
        ✅ {{ toast.message }}
    </div>

</div>

<script>
    const { createApp, ref, computed, watch, nextTick, onMounted, onUnmounted } = Vue

    createApp({
        setup() {
            // -- State variables --
            const currentTab = ref('dashboard');
            const tabOrder = ['dashboard', 'plan', 'incidents', 'logs', 'state'];
            const state = ref(null);
            const lastSync = ref('');
            const toast = ref({ show: false, message: '' });
            const authChecked = ref(false);
            const auth = ref({ authEnabled: false, authenticated: false, csrfToken: null });
            const loginPassword = ref('');
            const loginError = ref('');
            const isLoggingIn = ref(false);
            const logs = ref([]);
            const isFetchingLogs = ref(false);
            const logFilter = ref('ALL');
            const logLimit = ref(100);
            const incidents = ref({ active: [], acknowledged: [], resolved: [] });
            const isFetchingIncidents = ref(false);
            const isActivatingNotificationDevice = ref(false);
            const notificationPreferences = ref({ warning: true, error: true, peak_consumption: true });
            const notificationDevice = ref({ token: null, label: 'Dashboard device', active: false, error: '' });
            const stateVersion = ref(null);
            const lastConfirmedState = ref({});
            const pendingEdits = ref({});
            let refreshTimer = null;

            // API URLs. Assumes this page is served from the same server.
            const API_STATE = '/api/v1/state';
            const API_UPDATE = '/api/v1/settings/update';
            const API_LOGS = '/api/v1/logs';
            const API_INCIDENTS = '/api/v1/incidents';
            const API_NOTIFICATION_DEVICES = '/api/v1/notifications/devices';
            const API_PENDING_NOTIFICATIONS = '/api/v1/notifications/pending';
            const API_AUTH_STATUS = '/api/v1/auth/status';
            const API_AUTH_LOGIN = '/api/v1/auth/login';
            const API_AUTH_LOGOUT = '/api/v1/auth/logout';
            const POLL_INTERVAL_MS = 5000;
            const NOTIFICATION_TYPE_ORDER = ['warning', 'error', 'peak_consumption'];

            // Watches
            watch(currentTab, (newTab) => {
                if (!auth.value.authenticated) return;
                if (newTab === 'logs') {
                    fetchLogs();
                }
                if (newTab === 'incidents') {
                    fetchIncidents();
                }
                if (newTab === 'state') {
                    fetchState();
                }
            });

            const setCurrentTab = (tabName) => {
                if (tabOrder.includes(tabName)) {
                    currentTab.value = tabName;
                }
            };

            const handleTabKeydown = async (event) => {
                const currentIndex = tabOrder.indexOf(currentTab.value);
                if (currentIndex === -1) return;

                let nextIndex = currentIndex;
                if (event.key === 'ArrowRight') {
                    nextIndex = (currentIndex + 1) % tabOrder.length;
                } else if (event.key === 'ArrowLeft') {
                    nextIndex = (currentIndex - 1 + tabOrder.length) % tabOrder.length;
                } else if (event.key === 'Home') {
                    nextIndex = 0;
                } else if (event.key === 'End') {
                    nextIndex = tabOrder.length - 1;
                } else {
                    return;
                }

                event.preventDefault();
                setCurrentTab(tabOrder[nextIndex]);
                await nextTick();
                const tabButton = document.getElementById(`tab-${tabOrder[nextIndex]}`);
                if (tabButton) tabButton.focus();
            };

            // --- ENUMS CONFIGURATION ---
            const enums = {
                OperatingMode: [
                    { name: 'MODE_AUTO', value: 'Auto' },
                    { name: 'MODE_MANUAL', value: 'Manual' }
                ],
                MediatorGoal: [
                    { name: 'NO_CHARGING', value: 'No charging' },
                    { name: 'CHARGE_WITH_MINIMUM_SOLAR_POWER', value: 'Charge when any solar power' },
                    { name: 'CHARGE_WITH_ONLY_EXCESS_SOLAR_POWER', value: 'Charge with excess solar power' },
                    { name: 'CHARGE_WHEN_SELL_PRICE_NEGATIVE', value: 'Charge when sell price negative' },
                    { name: 'CHARGE_WHEN_BUY_PRICE_NEGATIVE', value: 'Charge when buy price negative' },
                    { name: 'CHARGE_NOW_WITH_CAPACITY_RATE', value: 'Charge now with capacity rate' },
                    { name: 'CHARGE_NOW_NO_CAPACITY_RATE', value: 'Charge now no capacity rate' },
                ],
                InverterManualState: [
                    { name: 'INV_CMD_LIMIT_STANDARD', value: 'Standard power limit' },
                    { name: 'INV_CMD_LIMIT_ZERO', value: 'Power limit zero' },
                    { name: 'INV_CMD_LIMIT_MANUAL', value: 'Manual power limit' },
                    { name: 'INV_CMD_LIMIT_TO_USE', value: 'Power limited to home consumption' }
                ],
                EVCCManualState: [
                    { name: 'EVCC_CMD_STATE_OFF', value: 'off' },
                    { name: 'EVCC_CMD_STATE_PV', value: 'pv' },
                    { name: 'EVCC_CMD_STATE_MINPV', value: 'minpv' },
                    { name: 'EVCC_CMD_STATE_NOW', value: 'now' }
                ],
                BatteryState: [
                    { name: 'BATTERY_ON', value: 'Zero' },
                    { name: 'BATTERY_OFF', value: 'Off' },
                    { name: 'BATTERY_FORCE_CHARGE', value: 'Force charge' },
                    { name: 'BATTERY_BLOCK_CHARGE', value: 'Block charge' },
                    { name: 'BATTERY_BLOCK_DISCHARGE', value: 'Block discharge'}
                ]
            };

            // --- Computed Properties ---
            const statusColor = computed(() => {
                if (!state.value || !state.value.app_state) return 'white';
                const s = state.value.app_state;
                const map = { NORMAL: '#4CAF50', STARTING: '#2196F3', DEGRADED: '#9E9E9E', WARNING: '#FF9800', ALARM: '#f44336', SHUTDOWN: '#000000' };
                return map[s] || 'white';
            });

            const currentPrice = computed(() => {
                if (!state.value || !state.value.electricity_prices_today) return null;
                const now = new Date();

                for (let data of state.value.electricity_prices_today) {
                    try {
                        const interval = typeof data === 'string' ? JSON.parse(data) : data;
                        const start = new Date(interval.interval_start_local);
                        const end = new Date(start.getTime() + (interval.resolution_minutes * 60000));

                        if (now >= start && now < end) {
                            return {
                                buy: interval.net_prices_eur_per_kwh?.dynamic?.buy ?? null,
                                sell: interval.net_prices_eur_per_kwh?.dynamic?.sell ?? null,
                                start: start,
                                end: end
                            };
                        }
                    } catch (e) { console.error("Error when parsing price:", e); }
                }
                return null;
            });

            const filteredLogs = computed(() => {
                if (logFilter.value === 'ALL') return logs.value;
                if (logFilter.value === 'IMPORTANT') {
                    return logs.value.filter(log => ['ERROR', 'WARNING', 'ALARM'].includes(log.level));
                }
                return logs.value.filter(log => log.level === logFilter.value);
            });

            // --- Helper Functions ---
            const showToast = (msg) => {
                toast.value = { show: true, message: msg };
                setTimeout(() => { toast.value.show = false; }, 3000);
            };

            const selectedNotificationTypes = () => {
                return NOTIFICATION_TYPE_ORDER.filter((key) => notificationPreferences.value[key]);
            };

            const getStoredNotificationToken = () => {
                if (typeof window === 'undefined' || !window.localStorage) return null;
                return window.localStorage.getItem('hec_notification_device_token');
            };

            const storeNotificationToken = (token) => {
                if (typeof window !== 'undefined' && window.localStorage) {
                    window.localStorage.setItem('hec_notification_device_token', token);
                }
            };

            const createNotificationToken = () => {
                const cryptoApi = typeof window !== 'undefined' && window.crypto
                    ? window.crypto
                    : (typeof crypto !== 'undefined' ? crypto : null);
                if (cryptoApi && cryptoApi.randomUUID) {
                    return cryptoApi.randomUUID();
                }
                return `dashboard-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            };

            const loadStoredNotificationDevice = () => {
                const token = getStoredNotificationToken();
                if (token) {
                    notificationDevice.value = {
                        ...notificationDevice.value,
                        token: token,
                        active: true,
                        error: ''
                    };
                }
            };

            const showBrowserNotification = (notification) => {
                const notificationApi = typeof Notification !== 'undefined'
                    ? Notification
                    : (typeof window !== 'undefined' ? window.Notification : null);
                if (!notificationApi || notificationApi.permission !== 'granted') return;
                new notificationApi(notification.title || 'Home Energy Control', {
                    body: notification.message || ''
                });
            };

            const formatPeakTimestamp = (ts) => {
                if (!ts) return 'N/A';
                const s = String(ts);
                if (s.length >= 10) {
                    return `${s.substring(4,6)}/${s.substring(2,4)} ${s.substring(6,8)}:${s.substring(8,10)}`;
                }
                return s;
            };

            const formatTime = (ts) => {
                if (!ts) return '';
                // Formats ISO string or timestamp to HH:mm
                const d = new Date(ts);
                return d.toLocaleTimeString('en-GB', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: false
                });
            };

            const formatTimeHm = (ts) => {
                if (!ts) return '';
                // Formats ISO string or timestamp to HH:mm
                const d = new Date(ts);
                return d.toLocaleTimeString('en-GB', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });
            };

            const formattedState = computed(() => {
                if (!state.value) return "Loading application state...";
                return JSON.stringify(state.value, null, 2);
            });

            const batteryModeDisplay = computed(() => {
                const rawMode = state.value?.battery_manual_mode;
                if (!rawMode) return 'UNKNOWN';
                const match = enums.BatteryState.find(opt => opt.name === rawMode);
                return match ? match.value : rawMode;
            });

            const summaryJobStatusText = computed(() => {
                const status = state.value?.summary_job_status;
                if (!status || status.state === 'idle') return '';
                const label = String(status.state || '').replace('_', ' ');
                return status.message ? `${label}: ${status.message}` : label;
            });

            const isCurrentInterval = (ts) => {
                if (!ts) return false;
                const rowTime = new Date(ts).getTime();
                const now = new Date().getTime();
                return now >= rowTime && now < (rowTime + 15 * 60000);
            };

            const applyAuthStatus = (data) => {
                auth.value = {
                    authEnabled: Boolean(data.auth_enabled),
                    authenticated: Boolean(data.authenticated),
                    csrfToken: data.csrf_token || null
                };
            };

            const csrfHeaders = () => {
                const headers = { 'Content-Type': 'application/json' };
                if (auth.value.csrfToken) {
                    headers['X-CSRF-Token'] = auth.value.csrfToken;
                }
                return headers;
            };

            const statePollHeaders = () => {
                if (stateVersion.value === null || stateVersion.value === undefined) return {};
                return { 'If-None-Match': `"${stateVersion.value}"` };
            };

            const normalizeStateVersion = (value) => {
                if (value === null || value === undefined || value === '') return null;
                const numericValue = Number(value);
                return Number.isFinite(numericValue) ? numericValue : null;
            };

            const setPending = (key, value) => {
                const next = { ...pendingEdits.value };
                if (value) {
                    next[key] = true;
                } else {
                    delete next[key];
                }
                pendingEdits.value = next;
            };

            const isPending = (key) => Boolean(pendingEdits.value[key]);

            const applyStatePayload = (payload) => {
                if (!payload) return;
                const payloadVersion = normalizeStateVersion(payload.state_version);
                const currentVersion = normalizeStateVersion(stateVersion.value);
                if (payloadVersion !== null && currentVersion !== null && payloadVersion < currentVersion) {
                    return;
                }
                if (payloadVersion !== null) {
                    stateVersion.value = payloadVersion;
                }
                lastConfirmedState.value = { ...payload };

                if (!state.value) {
                    state.value = { ...payload };
                    return;
                }

                const nextState = { ...payload };
                for (const key of Object.keys(pendingEdits.value)) {
                    if (Object.prototype.hasOwnProperty.call(state.value, key)) {
                        nextState[key] = state.value[key];
                    }
                }
                state.value = nextState;
            };

            const restoreLastConfirmedValue = (key) => {
                if (!state.value || !Object.prototype.hasOwnProperty.call(lastConfirmedState.value, key)) return;
                state.value[key] = lastConfirmedState.value[key];
            };

            const startRefreshTimer = () => {
                clearInterval(refreshTimer);
                refreshTimer = setInterval(() => {
                    if (auth.value.authenticated) {
                        fetchState();
                        fetchPendingNotifications();
                    }
                }, POLL_INTERVAL_MS);
            };

            const markLoggedOut = () => {
                auth.value = {
                    authEnabled: auth.value.authEnabled,
                    authenticated: false,
                    csrfToken: null
                };
                state.value = null;
                stateVersion.value = null;
                lastConfirmedState.value = {};
                pendingEdits.value = {};
                logs.value = [];
                incidents.value = { active: [], acknowledged: [], resolved: [] };
                clearInterval(refreshTimer);
            };

            const handleAuthFailure = (res) => {
                if (res.status === 401) {
                    markLoggedOut();
                    return true;
                }
                return false;
            };

            // --- API Calls ---
            const fetchAuthStatus = async () => {
                try {
                    const res = await fetch(API_AUTH_STATUS);
                    if (res.ok) {
                        applyAuthStatus(await res.json());
                    }
                } catch (error) {
                    console.error("Error fetching auth status:", error);
                } finally {
                    authChecked.value = true;
                }
            };

            const login = async () => {
                isLoggingIn.value = true;
                loginError.value = '';
                try {
                    const res = await fetch(API_AUTH_LOGIN, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password: loginPassword.value })
                    });
                    const result = await res.json();
                    if (res.ok && result.success) {
                        applyAuthStatus({
                            auth_enabled: true,
                            authenticated: true,
                            csrf_token: result.csrf_token
                        });
                        loginPassword.value = '';
                        loadStoredNotificationDevice();
                        await fetchState();
                        await fetchPendingNotifications();
                        startRefreshTimer();
                    } else {
                        loginError.value = result.error || 'Login failed';
                    }
                } catch (error) {
                    loginError.value = `Login failed: ${error.message}`;
                } finally {
                    isLoggingIn.value = false;
                }
            };

            const logout = async () => {
                try {
                    await fetch(API_AUTH_LOGOUT, {
                        method: 'POST',
                        headers: csrfHeaders()
                    });
                } catch (error) {
                    console.error("Error during logout:", error);
                } finally {
                    markLoggedOut();
                }
            };

            const fetchState = async () => {
                try {
                    const url = stateVersion.value === null || stateVersion.value === undefined
                        ? API_STATE
                        : `${API_STATE}?since_version=${encodeURIComponent(stateVersion.value)}`;
                    const res = await fetch(url, { headers: statePollHeaders() });
                    if (handleAuthFailure(res)) return;
                    if (res.status === 304) {
                        lastSync.value = new Date().toLocaleTimeString();
                        return;
                    }
                    if (res.ok) {
                        applyStatePayload(await res.json());
                        lastSync.value = new Date().toLocaleTimeString();
                    }
                } catch (error) {
                    console.error("Error when fetching state:", error);
                }
            };

            const updateSetting = async (key, value) => {
                setPending(key, true);
                try {
                    const res = await fetch(API_UPDATE, {
                        method: 'POST',
                        headers: csrfHeaders(),
                        body: JSON.stringify({ key: key, value: value })
                    });
                    if (handleAuthFailure(res)) return;
                    const result = await res.json();

                    if (result.success) {
                        setPending(key, false);
                        if (result.state) {
                            applyStatePayload(result.state);
                        } else {
                            if (state.value && Object.prototype.hasOwnProperty.call(state.value, result.key)) {
                                state.value[result.key] = result.new_value_stored;
                            }
                            if (result.state_version !== undefined && result.state_version !== null) {
                                stateVersion.value = result.state_version;
                            }
                            lastConfirmedState.value = { ...state.value };
                        }
                        showToast(`Setting '${key}' updated.`);
                    } else {
                        if (res.status === 403) {
                            await fetchAuthStatus();
                        }
                        restoreLastConfirmedValue(key);
                        alert(`Error when updating: ${result.error}`);
                    }
                } catch (error) {
                    restoreLastConfirmedValue(key);
                    alert(`API error: ${error.message}`);
                } finally {
                    setPending(key, false);
                }
            };

            const requestRestart = () => {
                const confirmed = window.confirm("Stop Home Energy Control for supervised restart? The runtime will shut down safely, then the external supervisor must start it again.");
                if (confirmed) {
                    updateSetting('reboot_request', true);
                }
            };
            const requestShutdown = requestRestart;

            const requestSummary = () => {
                updateSetting('summary_request', true);
            };

            const fetchLogs = async () => {
                isFetchingLogs.value = true;
                try {
                    const res = await fetch(`${API_LOGS}?limit=${logLimit.value}`);
                    if (handleAuthFailure(res)) return;
                    if (res.ok) {
                        const data = await res.json();
                        logs.value = data.logs;
                    }
                } catch (error) {
                    console.error("Error fetching logs:", error);
                } finally {
                    isFetchingLogs.value = false;
                }
            };

            const fetchIncidents = async () => {
                isFetchingIncidents.value = true;
                try {
                    const res = await fetch(API_INCIDENTS);
                    if (handleAuthFailure(res)) return;
                    if (res.ok) {
                        const data = await res.json();
                        incidents.value = {
                            active: data.active || [],
                            acknowledged: data.acknowledged || [],
                            resolved: data.resolved || []
                        };
                    }
                } catch (error) {
                    console.error("Error fetching incidents:", error);
                } finally {
                    isFetchingIncidents.value = false;
                }
            };

            const acknowledgeIncident = async (incidentId) => {
                try {
                    const res = await fetch(`${API_INCIDENTS}/${incidentId}/acknowledge`, {
                        method: 'POST',
                        headers: csrfHeaders(),
                        body: JSON.stringify({ acknowledged_by: 'dashboard' })
                    });
                    if (handleAuthFailure(res)) return;
                    const result = await res.json();
                    if (res.ok && result.success) {
                        if (result.state) {
                            applyStatePayload(result.state);
                        }
                        await fetchIncidents();
                        showToast('Incident acknowledged.');
                    } else {
                        alert(`Error when acknowledging incident: ${result.error}`);
                    }
                } catch (error) {
                    alert(`API error: ${error.message}`);
                }
            };

            const acknowledgeAllIncidents = async () => {
                try {
                    const res = await fetch(`${API_INCIDENTS}/acknowledge-all`, {
                        method: 'POST',
                        headers: csrfHeaders(),
                        body: JSON.stringify({ acknowledged_by: 'dashboard' })
                    });
                    if (handleAuthFailure(res)) return;
                    const result = await res.json();
                    if (res.ok && result.success) {
                        if (result.state) {
                            applyStatePayload(result.state);
                        }
                        await fetchIncidents();
                        showToast('Active incidents acknowledged.');
                    } else {
                        alert(`Error when acknowledging incidents: ${result.error}`);
                    }
                } catch (error) {
                    alert(`API error: ${error.message}`);
                }
            };

            const activateNotificationDevice = async () => {
                isActivatingNotificationDevice.value = true;
                notificationDevice.value = { ...notificationDevice.value, error: '' };
                try {
                    const notificationApi = typeof Notification !== 'undefined'
                        ? Notification
                        : (typeof window !== 'undefined' ? window.Notification : null);
                    if (!notificationApi) {
                        notificationDevice.value.error = 'Browser notifications are not available.';
                        return;
                    }
                    let permission = notificationApi.permission;
                    if (permission !== 'granted') {
                        permission = await (
                            typeof Notification !== 'undefined'
                                ? Notification.requestPermission()
                                : notificationApi.requestPermission()
                        );
                    }
                    if (permission !== 'granted') {
                        notificationDevice.value.error = 'Browser notification permission was not granted.';
                        return;
                    }

                    const token = getStoredNotificationToken() || createNotificationToken();
                    storeNotificationToken(token);
                    const response = await fetch(API_NOTIFICATION_DEVICES, {
                        method: 'POST',
                        headers: csrfHeaders(),
                        body: JSON.stringify({
                            device_token: token,
                            label: notificationDevice.value.label || 'Dashboard device',
                            notification_types: selectedNotificationTypes(),
                            enabled: true
                        })
                    });
                    if (handleAuthFailure(response)) return;
                    const result = await response.json();
                    if (response.ok && (result.success || result.device)) {
                        notificationDevice.value = {
                            token: token,
                            label: result.device.label || 'Dashboard device',
                            active: true,
                            error: ''
                        };
                        showToast('Notification device updated.');
                        await fetchPendingNotifications();
                    } else {
                        notificationDevice.value.error = result.error || 'Notification device update failed.';
                    }
                } catch (error) {
                    notificationDevice.value.error = error.message;
                } finally {
                    isActivatingNotificationDevice.value = false;
                }
            };

            const fetchPendingNotifications = async () => {
                if (!notificationDevice.value.active || !notificationDevice.value.token) return;
                try {
                    const url = `${API_PENDING_NOTIFICATIONS}?device_token=${encodeURIComponent(notificationDevice.value.token)}`;
                    const res = await fetch(url);
                    if (handleAuthFailure(res)) return;
                    if (res.ok) {
                        const data = await res.json();
                        for (const notification of (data.notifications || [])) {
                            showBrowserNotification(notification);
                        }
                    }
                } catch (error) {
                    console.error("Error fetching pending notifications:", error);
                }
            };

            // --- Lifecycle Hooks ---
            onMounted(async () => {
                await fetchAuthStatus();
                if (auth.value.authenticated) {
                    loadStoredNotificationDevice();
                    await fetchState();
                    await fetchPendingNotifications();
                    startRefreshTimer();
                }
            });

            onUnmounted(() => {
                clearInterval(refreshTimer);
            })

            if (typeof window !== 'undefined' && window.__HEC_DASHBOARD_ENABLE_TEST_HOOKS__) {
                window.__HEC_DASHBOARD_TEST_HOOKS__ = {
                    state,
                    stateVersion,
                    lastConfirmedState,
                    pendingEdits,
                    incidents,
                    notificationPreferences,
                    notificationDevice,
                    auth,
                    setPending,
                    isPending,
                    applyStatePayload,
                    restoreLastConfirmedValue,
                    fetchPendingNotifications,
                    acknowledgeAllIncidents
                };
            }

            return { currentTab, setCurrentTab, handleTabKeydown, state, lastSync, enums, statusColor, currentPrice, formatTime, updateSetting, toast,
                formatPeakTimestamp, logs, fetchLogs, isFetchingLogs, logFilter, filteredLogs, formattedState,
